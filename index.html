<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penyimpanan LPDP UGM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f8f9fa; user-select: none; }
    .file-item {
      width: 150px; text-align: center; padding: 15px; margin: 10px;
      border-radius: 10px; cursor: pointer; background: white;
      transition: all 0.2s ease;
    }
    .file-item:hover { background: #f1f3f5; }
    .file-item.selected { border: 2px solid #007bff; background: #e9f2ff; }
    .file-thumb {
      width: 80px; height: 80px; object-fit: contain; margin-bottom: 8px;
      pointer-events: none;
    }
    .context-menu {
      position: absolute; display: none; z-index: 9999;
      background: white; border: 1px solid #ccc; border-radius: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .context-menu ul { list-style: none; margin: 0; padding: 5px 0; }
    .context-menu li { padding: 8px 15px; cursor: pointer; }
    .context-menu li:hover { background: #f1f1f1; }
    footer {
      text-align: center; color: #666; font-size: 0.9rem;
      margin-top: 50px; padding: 20px 0; border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>
<div class="container py-4">
  <h3 class="mb-3">📁 Penyimpanan LPDP UGM</h3>

  <nav aria-label="breadcrumb">
    <ol class="breadcrumb" id="breadcrumb">
      <li class="breadcrumb-item"><a href="#" onclick="navigateTo('')">🏠 Home</a></li>
    </ol>
  </nav>

  <div class="d-flex flex-wrap" id="fileContainer"></div>

  <div id="contextMenu" class="context-menu">
    <ul id="contextMenuList"></ul>
  </div>

  <footer>© 2025 Kelurahan LPDP UGM — All rights reserved.</footer>
</div>

<script>
let currentPath = '';
let selectedItem = null;

async function loadFiles(path = '') {
  currentPath = path;
  const res = await fetch(`/api/upload?path=${encodeURIComponent(path)}`);
  const files = await res.json();
  renderBreadcrumb(path);
  renderFiles(files);
}

function renderBreadcrumb(path) {
  const breadcrumb = document.getElementById('breadcrumb');
  const parts = path.split('/').filter(Boolean);
  breadcrumb.innerHTML = `<li class="breadcrumb-item"><a href="#" onclick="navigateTo('')">🏠 Home</a></li>`;
  let cumulative = '';
  parts.forEach((p, i) => {
    cumulative += (i ? '/' : '') + p;
    breadcrumb.innerHTML += `<li class="breadcrumb-item"><a href="#" onclick="navigateTo('${cumulative}')">${p}</a></li>`;
  });
}

function renderFiles(files) {
  const container = document.getElementById('fileContainer');
  container.innerHTML = '';

  // sembunyikan hal tertentu di root
  if (currentPath === '') {
    files = files.filter(f =>
      !f.name.endsWith('.md') &&
      !f.name.endsWith('.html') &&
      f.name !== 'api' &&
      f.name !== '.gitignore'
    );
  }

  files.forEach(file => {
    const isDir = file.type === 'dir';
    const item = document.createElement('div');
    item.className = 'file-item';
    item.draggable = false;

    // --- thumbnail handling ---
    let thumbHTML = '';
    const ext = file.name.split('.').pop().toLowerCase();

    if (isDir) {
      thumbHTML = `<img src="https://cdn-icons-png.flaticon.com/512/716/716784.png" class="file-thumb" alt="Folder">`;
    } else if (['png','jpg','jpeg','gif','webp'].includes(ext)) {
      thumbHTML = `<img src="https://raw.githubusercontent.com/lpdpugm/penyimpanan/main/${file.path}" class="file-thumb" alt="${file.name}">`;
    } else if (ext === 'pdf') {
      thumbHTML = `
        <svg class="file-thumb" viewBox="0 0 48 48">
          <rect width="48" height="48" rx="8" ry="8" fill="#ff3b30"></rect>
          <text x="50%" y="60%" fill="white" font-size="16" font-weight="bold" text-anchor="middle">PDF</text>
        </svg>`;
    } else {
      thumbHTML = `<img src="https://cdn-icons-png.flaticon.com/512/337/337946.png" class="file-thumb" alt="File">`;
    }

    item.innerHTML = `${thumbHTML}<br>${file.name}`;

    item.onclick = () => {
      document.querySelectorAll('.file-item').forEach(f => f.classList.remove('selected'));
      item.classList.add('selected');
      selectedItem = file;
    };

    item.ondblclick = () => {
      if (isDir) navigateTo(file.path);
      else window.open(`https://simpan-lpdpugm.vercel.app/${file.path.replace(/ /g, '%20')}`, '_blank');
    };

    item.oncontextmenu = e => {
      e.preventDefault();
      document.querySelectorAll('.file-item').forEach(f => f.classList.remove('selected'));
      item.classList.add('selected');
      selectedItem = file;
      showContextMenu(e, file);
    };

    container.appendChild(item);
  });

  // klik kanan area kosong
  container.oncontextmenu = e => {
    if (e.target.id === 'fileContainer' || e.target === container) {
      e.preventDefault();
      selectedItem = null;
      showContextMenu(e, null);
    }
  };
}

function showContextMenu(e, file) {
  const menu = document.getElementById('contextMenu');
  const list = document.getElementById('contextMenuList');
  let html = '';

  if (file) {
    const isDir = file.type === 'dir';
    if (isDir) {
      html += `<li onclick="navigateTo('${file.path}')">📂 Buka Folder</li>`;
      html += `<li onclick="deleteItem('${file.path}')">🗑️ Hapus Folder</li>`;
    } else {
      const fileURL = `https://simpan-lpdpugm.vercel.app/${file.path.replace(/ /g, '%20')}`;
      html += `<li onclick="copyLink('${fileURL}')">🔗 Salin Link</li>`;
      html += `<li onclick="deleteItem('${file.path}')">🗑️ Hapus File</li>`;
    }
  } else {
    // klik kanan area kosong
    html += `<li onclick="newFolder()">📁 Folder Baru</li>`;
    html += `<li onclick="uploadFile()">📤 Upload File</li>`;
  }

  list.innerHTML = html;
  menu.style.display = 'block';
  menu.style.left = `${e.pageX}px`;
  menu.style.top = `${e.pageY}px`;
}

window.onclick = () => document.getElementById('contextMenu').style.display = 'none';

function copyLink(url) {
  navigator.clipboard.writeText(url);
  alert('Tautan disalin:\n' + url);
}

async function deleteItem(path) {
  if (!confirm(`Yakin hapus ${path}?`)) return;
  const res = await fetch('/api/upload', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path })
  });
  if (res.ok) loadFiles(currentPath);
  else alert('Gagal menghapus file.');
}

function navigateTo(path) { loadFiles(path); }

async function newFolder() {
  const name = prompt('Nama folder baru:');
  if (!name) return;
  await fetch('/api/upload', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ folder: true, path: `${currentPath}/${name}` })
  });
  loadFiles(currentPath);
}

function uploadFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    const content = await file.text();
    await fetch('/api/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: `${currentPath}/${file.name}`,
        content: btoa(unescape(encodeURIComponent(content)))
      })
    });
    loadFiles(currentPath);
  };
  input.click();
}

loadFiles();
</script>
</body>
</html>
