<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>File Uploader - LPDP UGM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css">
</head>
<body class="bg-gray-100 min-h-screen p-8">
  <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow">
    <h1 class="text-2xl font-bold mb-4">📁 Penyimpanan Dokumen LPDP UGM</h1>

    <!-- Upload Form -->
    <form id="uploadForm" class="mb-6 space-y-3">
      <div>
        <label class="block font-semibold mb-1">Pilih File:</label>
        <input type="file" id="fileInput" class="block w-full border p-2 rounded">
      </div>

      <div>
        <label class="block font-semibold mb-1">Pilih Folder Tujuan:</label>
        <select id="folderSelect" class="w-full border p-2 rounded">
          <option value="">(Root folder)</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold mb-1">Atau buat folder baru:</label>
        <input type="text" id="newFolder" placeholder="misal: laporan2025" class="w-full border p-2 rounded">
      </div>

      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Upload File
      </button>
    </form>

    <p id="status" class="text-gray-600 mb-4"></p>

    <!-- Navigasi Folder -->
    <div class="mb-4 text-sm text-gray-600">
      <span id="currentPath">📂 /</span>
    </div>

    <ul id="fileList" class="space-y-2"></ul>
  </div>

  <script>
    const repoOwner = "lpdpugm";
    const repoName = "penyimpanan";
    const branch = "main";
    const baseApi = `https://api.github.com/repos/${repoOwner}/${repoName}/contents`;
    const baseUrl = "https://simpan-lpdpugm.vercel.app";

    let currentPath = "";

    async function fetchContents(path = "") {
      const res = await fetch(`${baseApi}/${path}?ref=${branch}`);
      const data = await res.json();
      return Array.isArray(data) ? data : [];
    }

    // 🔄 Load folder atau file di path tertentu
    async function loadDirectory(path = "") {
      currentPath = path;
      const fileList = document.getElementById("fileList");
      const currentPathLabel = document.getElementById("currentPath");

      currentPathLabel.textContent = "📂 /" + (path ? path : "");

      fileList.innerHTML = "🔄 Memuat...";

      const items = await fetchContents(path);
      fileList.innerHTML = "";

      // Tambah tombol naik ke atas folder
      if (path) {
        const parentPath = path.split("/").slice(0, -1).join("/");
        const up = document.createElement("li");
        up.innerHTML = `<button class="text-blue-600 underline" onclick="loadDirectory('${parentPath}')">⬅️ Kembali</button>`;
        fileList.appendChild(up);
      }

      // Urutkan: folder dulu, lalu file
      items.sort((a, b) => (a.type > b.type ? 1 : -1));

      for (const item of items) {
        if (item.type === "dir") {
          const li = document.createElement("li");
          li.innerHTML = `
            <button class="text-blue-700 font-semibold underline" onclick="loadDirectory('${item.path}')">
              📁 ${item.name}
            </button>
          `;
          fileList.appendChild(li);
        } else if (item.type === "file") {
          const ext = item.name.split(".").pop().toLowerCase();
          const isRoot = !path;

          // di root: sembunyikan md dan html
          if (isRoot && (ext === "md" || ext === "html")) continue;

          const encodedPath = encodeURIComponent(item.path).replace(/%2F/g, "/").replace(/%20/g, "%20");
          const fileUrl = `${baseUrl}/${encodedPath}`;

          const li = document.createElement("li");
          li.innerHTML = `
            <div class="flex items-center justify-between border rounded p-2">
              <a href="${item.download_url}" target="_blank" class="text-blue-700">${item.name}</a>
              <button onclick="copyUrl('${fileUrl}')" class="text-sm bg-gray-200 px-2 py-1 rounded hover:bg-gray-300">
                Salin URL
              </button>
            </div>
          `;
          fileList.appendChild(li);
        }
      }
    }

    async function loadFolderList(path = "", folderList = []) {
      const res = await fetch(`${baseApi}/${path}?ref=${branch}`);
      const data = await res.json();
      if (!Array.isArray(data)) return folderList;

      for (const item of data) {
        if (item.type === "dir") {
          folderList.push(item.path);
          await loadFolderList(item.path, folderList);
        }
      }
      return folderList;
    }

    async function init() {
      await loadDirectory();
      const folders = await loadFolderList();
      const select = document.getElementById("folderSelect");
      folders.forEach(f => {
        const opt = document.createElement("option");
        opt.value = f;
        opt.textContent = f;
        select.appendChild(opt);
      });
    }

    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = document.getElementById("fileInput").files[0];
      if (!file) return alert("Pilih file terlebih dahulu.");

      const folderSelect = document.getElementById("folderSelect").value;
      const newFolder = document.getElementById("newFolder").value.trim();
      const path = newFolder ? `${newFolder}/${file.name}` : (folderSelect ? `${folderSelect}/${file.name}` : file.name);

      document.getElementById("status").textContent = "🚀 Mengunggah...";

      const base64 = await fileToBase64(file);
      const res = await fetch("/api/upload", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path, content: base64 })
      });
      const data = await res.json();

      document.getElementById("status").textContent = data.message || "Selesai.";
      await loadDirectory(currentPath);
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function copyUrl(url) {
      navigator.clipboard.writeText(url).then(() => {
        alert("✅ Link disalin:\n" + url);
      });
    }

    init();
  </script>
</body>
</html>
