<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Mini Drive LPDP UGM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f9fafb; }
    #dropzone {
      position: fixed; inset: 0; background: rgba(70,95,255,0.1);
      border: 3px dashed #465fff; color: #465fff; font-size: 1.3em;
      display: none; align-items: center; justify-content: center; z-index: 50;
    }
    .context-menu {
      position: absolute; background: white; border: 1px solid #ddd;
      border-radius: 6px; box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      display: none; flex-direction: column; z-index: 100;
    }
    .context-menu button {
      border: none; background: none; padding: 8px 16px; text-align: left;
    }
    .context-menu button:hover {
      background: #465fff; color: white;
    }
    .item {
      cursor: pointer; text-align: center; border: 1px solid #e5e7eb;
      border-radius: 10px; padding: 12px; background: white;
      transition: 0.2s; display: flex; flex-direction: column; align-items: center;
    }
    .item:hover { background: #eef1ff; }
    .item img { width: 64px; height: 64px; }
  </style>
</head>
<body class="p-3">

  <div class="container">
    <h3 class="mb-3 text-primary">📁 Mini Drive LPDP UGM</h3>
    <p class="text-muted">Path: <span id="path">/</span></p>
    <div id="grid" class="row g-3"></div>
  </div>

  <div id="dropzone">Lepas file di sini untuk upload</div>
  <div id="menu" class="context-menu"></div>

  <script>
    const repoOwner = "lpdpugm";
    const repoName = "penyimpanan";
    const branch = "main";
    const baseApi = `https://api.github.com/repos/${repoOwner}/${repoName}/contents`;
    const baseUrl = "https://simpan-lpdpugm.vercel.app";

    let currentPath = "";

    async function listFolder(path = "") {
      const res = await fetch(`${baseApi}/${path}?ref=${branch}`);
      const data = await res.json();
      const grid = document.getElementById("grid");
      const pathLabel = document.getElementById("path");

      pathLabel.textContent = "/" + (path || "");
      grid.innerHTML = "";

      if (path) {
        const back = createItem("⬅️ ..", "dir", "", () =>
          listFolder(path.split("/").slice(0, -1).join("/"))
        );
        grid.appendChild(back);
      }

      if (!Array.isArray(data)) return;

      data
        .filter(f => f.name !== "api")
        .sort((a, b) => a.type.localeCompare(b.type))
        .forEach(item => {
          if (item.type === "dir") {
            grid.appendChild(
              createItem(item.name, "dir", item.path, () => listFolder(item.path))
            );
          } else {
            const ext = item.name.split(".").pop().toLowerCase();
            if (!path && ["md", "html"].includes(ext)) return;
            grid.appendChild(
              createItem(item.name, "file", item.path, () =>
                window.open(item.download_url)
              )
            );
          }
        });
    }

    function createItem(name, type, path, onClick) {
      const div = document.createElement("div");
      div.className = "col-6 col-sm-4 col-md-3 col-lg-2";
      div.innerHTML = `
        <div class="item" data-type="${type}" data-name="${name}" data-path="${path}">
          <img src="${type === "dir"
            ? "https://cdn-icons-png.flaticon.com/512/716/716784.png"
            : "https://cdn-icons-png.flaticon.com/512/337/337946.png"}">
          <div>${name}</div>
        </div>`;
      div.querySelector(".item").onclick = onClick;
      return div;
    }

    async function uploadFile(path, content) {
      const res = await fetch("/api/upload", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ path, content: content.split(",")[1] })
      });
      return res.json();
    }

    function toBase64(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
    }

    // 🔹 Drag & Drop Upload
    const dz = document.getElementById("dropzone");
    document.body.addEventListener("dragover", e => {
      e.preventDefault(); dz.style.display = "flex";
    });
    document.body.addEventListener("dragleave", e => {
      e.preventDefault(); dz.style.display = "none";
    });
    document.body.addEventListener("drop", async e => {
      e.preventDefault(); dz.style.display = "none";
      for (const f of e.dataTransfer.files) {
        const b64 = await toBase64(f);
        const path = `${currentPath ? currentPath + "/" : ""}${f.name}`;
        await uploadFile(path, b64);
      }
      listFolder(currentPath);
    });

    // 🔹 Klik kanan menu (Upload File + Folder Baru)
    const menu = document.getElementById("menu");
    document.addEventListener("contextmenu", e => {
      e.preventDefault();
      const target = e.target.closest(".item");
      menu.innerHTML = "";
      menu.style.display = "flex";
      menu.style.left = e.pageX + "px";
      menu.style.top = e.pageY + "px";

      if (target && target.dataset.type === "file") {
        const fileUrl = `${baseUrl}/${encodeURIComponent(target.dataset.path).replace(/%2F/g, "/")}`;
        addMenu("Salin Link", () => {
          navigator.clipboard.writeText(fileUrl);
          alert("✅ Link disalin:\n" + fileUrl);
        });
      } else {
        addMenu("Upload File", async () => {
          const input = document.createElement("input");
          input.type = "file";
          input.multiple = true;
          input.onchange = async () => {
            for (const f of input.files) {
              const b64 = await toBase64(f);
              const path = `${currentPath ? currentPath + "/" : ""}${f.name}`;
              await uploadFile(path, b64);
            }
            listFolder(currentPath);
          };
          input.click();
        });
        addMenu("Buat Folder Baru", async () => {
          const name = prompt("Nama folder baru:");
          if (!name) return;
          const folderPath = `${currentPath ? currentPath + "/" : ""}${name}/.keep`;
          await uploadFile(folderPath, btoa(""));
          listFolder(currentPath);
        });
      }
    });
    document.addEventListener("click", () => (menu.style.display = "none"));

    function addMenu(text, fn) {
      const btn = document.createElement("button");
      btn.textContent = text;
      btn.onclick = fn;
      menu.appendChild(btn);
    }

    listFolder();
  </script>
</body>
</html>
