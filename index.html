<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload File ke Repo GitHub</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .hidden-input { display: none; }
    .success { color: green; }
    .error { color: red; }
    .url { font-family: monospace; word-break: break-all; }
  </style>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Upload File ke GitHub Repo</h4>
      </div>
      <div class="card-body">
        <p class="text-muted">
          ⚠️ File akan di-upload langsung ke repo GitHub kamu. Pastikan token dan repo benar.
        </p>

        <!-- Form Upload -->
        <form id="uploadForm">
          <!-- Input tersembunyi -->
          <div class="hidden-input">
            <input type="text" id="token" value="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" required />
            <input type="text" id="owner" value="lpdpugm" required />
            <input type="text" id="repo" value="penyimpanan" required />
            <input type="text" id="branch" value="main" required />
          </div>

          <div class="mb-3">
            <label for="folder" class="form-label">Folder Tujuan:</label>
            <input type="text" class="form-control" id="folder" placeholder="contoh: uploads/" value="uploads/" />
          </div>

          <div class="mb-3">
            <label for="file" class="form-label">Pilih File:</label>
            <input type="file" class="form-control" id="file" required />
          </div>

          <button type="button" class="btn btn-success" onclick="uploadFile()">Upload ke GitHub</button>
        </form>

        <!-- Hasil Upload -->
        <div id="result" class="mt-4"></div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Konfigurasi default
    const CONFIG = {
      token: "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", 
      owner: "lpdpugm",         
      repo: "penyimpanan",              
      branch: "main"                 
    };

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("token").value = CONFIG.token;
      document.getElementById("owner").value = CONFIG.owner;
      document.getElementById("repo").value = CONFIG.repo;
      document.getElementById("branch").value = CONFIG.branch;
    });

    async function uploadFile() {
      const token = document.getElementById('token').value.trim();
      const owner = document.getElementById('owner').value.trim();
      const repo = document.getElementById('repo').value.trim();
      const branch = document.getElementById('branch').value.trim() || 'main';
      const folder = document.getElementById('folder').value.trim() || '';
      const fileInput = document.getElementById('file');
      const resultDiv = document.getElementById('result');

      if (!token || !owner || !repo || !fileInput.files[0]) {
        resultDiv.innerHTML = '<p class="error">Token, owner, repo, dan file harus diisi.</p>';
        return;
      }

      const file = fileInput.files[0];
      const fileName = file.name;
      const filePath = (folder ? folder.replace(/\/$/, '') + '/' : '') + fileName;

      resultDiv.innerHTML = '<p class="text-info">Uploading...</p>';

      try {
        const content = await readFileAsBase64(file);

        // GitHub API: Get current commit SHA untuk branch
        const branchInfo = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/branches/${branch}`,
          { headers: { Authorization: `Bearer ${token}` } }
        ).then(r => r.json());

        const sha = branchInfo.commit.sha;

        // Ambil tree dari commit terakhir
        const commit = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/git/commits/${sha}`,
          { headers: { Authorization: `Bearer ${token}` } }
        ).then(r => r.json());

        const treeSha = commit.tree.sha;

        // Buat tree baru dengan file
        const newTree = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/git/trees`,
          {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              base_tree: treeSha,
              tree: [
                {
                  path: filePath,
                  mode: '100644',
                  type: 'blob',
                  content: atob(content.split(',')[1]) // Decode base64
                }
              ]
            })
          }
        ).then(r => r.json());

        // Buat commit baru
        const commitRes = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/git/commits`,
          {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: `Upload file: ${fileName}`,
              tree: newTree.sha,
              parents: [sha]
            })
          }
        ).then(r => r.json());

        // Update reference branch ke commit baru
        await fetch(
          `https://api.github.com/repos/${owner}/${repo}/git/refs/heads/${branch}`,
          {
            method: 'PATCH',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              sha: commitRes.sha
            })
          }
        );

        const publicUrl = `https://${owner}.github.io/${repo}/${filePath}`;
        resultDiv.innerHTML = `
          <div class="alert alert-success">
            ✅ File berhasil diupload!<br>
            <strong>URL Publik:</strong> <span class="url">${publicUrl}</span><br>
            <button class="btn btn-sm btn-outline-success mt-2" onclick="navigator.clipboard.writeText('${publicUrl}')">Copy URL</button>
          </div>
        `;
      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = `<div class="alert alert-danger">❌ Error: ${err.message || 'Terjadi kesalahan.'}</div>`;
      }
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = err => reject(err);
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
