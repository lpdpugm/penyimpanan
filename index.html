<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Uploader GitHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css">
</head>
<body class="bg-gray-100 p-10">
  <div class="max-w-lg mx-auto bg-white p-6 rounded-xl shadow">
    <h2 class="text-xl font-bold mb-4">Upload File ke GitHub</h2>
    <form id="uploadForm">
      <input type="file" id="fileInput" class="block mb-4">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Upload</button>
    </form>
    <p id="status" class="mt-2 text-gray-600"></p>
    <hr class="my-4">
    <h3 class="text-lg font-semibold mb-2">Daftar File</h3>
    <ul id="fileList" class="text-blue-700 underline"></ul>
  </div>

  <script>
    const repoOwner = "lpdpugm"; // Ganti
    const repoName = "penyimpanan"; // Ganti
    const branch = "main";

    async function loadFiles() {
      const res = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/`);
      const files = await res.json();
      const list = document.getElementById('fileList');
      list.innerHTML = '';
      files.forEach(f => {
        if (f.type === 'file') {
          const li = document.createElement('li');
          li.innerHTML = `<a href="${f.download_url}" target="_blank">${f.name}</a>`;
          list.appendChild(li);
        }
      });
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = document.getElementById('fileInput').files[0];
      if (!file) return;

      document.getElementById('status').textContent = "Mengunggah...";

      const base64 = await fileToBase64(file);
      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          path: file.name,
          content: base64,
        })
      });

      const data = await res.json();
      document.getElementById('status').textContent = data.message || 'Selesai.';
      loadFiles();
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    loadFiles();
  </script>
</body>
</html>
