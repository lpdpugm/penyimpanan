<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penyimpanan LPDP UGM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .file-item:hover { background: #eef; cursor: pointer; }
    #context-menu {
      position: absolute; display: none; z-index: 1000;
      background: white; border: 1px solid #ccc; border-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    #context-menu a { display: block; padding: 8px 12px; color: #333; text-decoration: none; }
    #context-menu a:hover { background: #007bff; color: white; }
    .dropzone { border: 2px dashed #aaa; border-radius: 10px; padding: 40px; text-align: center; color: #666; }
  </style>
</head>
<body class="container py-4">
  <h2 class="mb-3">📁 Penyimpanan LPDP UGM</h2>
  <nav id="breadcrumb" class="mb-3"></nav>

  <div id="file-list" class="list-group mb-4"></div>

  <div class="dropzone" id="dropzone">Tarik & letakkan file di sini untuk mengunggah</div>

  <!-- Context menu -->
  <div id="context-menu">
    <a href="#" id="ctx-upload">Upload file</a>
    <a href="#" id="ctx-newfolder">Buat folder baru</a>
  </div>

  <script>
    const BASE_URL = "https://simpan-lpdpugm.vercel.app/";
    let currentPath = "";
    const fileList = document.getElementById("file-list");
    const breadcrumb = document.getElementById("breadcrumb");
    const contextMenu = document.getElementById("context-menu");

    async function loadFiles(path = "") {
      currentPath = path;
      breadcrumb.innerHTML = path ? `<a href="#" onclick="loadFiles('')">Root</a> / ${path}` : "Root";
      fileList.innerHTML = "<div class='text-muted'>Loading...</div>";

      const res = await fetch(`/api/upload?path=${encodeURIComponent(path)}`);
      const data = await res.json();

      fileList.innerHTML = "";

      // folder dulu
      data.filter(f => f.type === "dir" && f.name !== "api").forEach(f => {
        const div = document.createElement("div");
        div.className = "list-group-item file-item fw-bold";
        div.textContent = "📁 " + f.name;
        div.onclick = () => loadFiles(path ? `${path}/${f.name}` : f.name);
        fileList.appendChild(div);
      });

      // lalu file
      data.filter(f => f.type === "file" && !f.name.endsWith(".md") && !f.name.endsWith(".html")).forEach(f => {
        const div = document.createElement("div");
        div.className = "list-group-item file-item";
        const link = `${BASE_URL}${f.path}`;
        div.innerHTML = `📄 ${f.name} <button class="btn btn-sm btn-outline-secondary float-end" onclick="copyLink('${link}')">Salin Link</button>`;
        fileList.appendChild(div);
      });
    }

    async function uploadFile(file) {
      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result.split(",")[1];
        const res = await fetch("/api/upload", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            path: currentPath,
            filename: file.name,
            content: base64
          }),
        });
        await res.json();
        loadFiles(currentPath);
      };
      reader.readAsDataURL(file);
    }

    function copyLink(url) {
      navigator.clipboard.writeText(url.replace(/ /g, "%20"));
      alert("Link disalin:\n" + url);
    }

    // Drag & drop
    const dropzone = document.getElementById("dropzone");
    dropzone.addEventListener("dragover", e => e.preventDefault());
    dropzone.addEventListener("drop", e => {
      e.preventDefault();
      for (const file of e.dataTransfer.files) uploadFile(file);
    });

    // Klik kanan
    window.addEventListener("contextmenu", e => {
      e.preventDefault();
      contextMenu.style.top = `${e.pageY}px`;
      contextMenu.style.left = `${e.pageX}px`;
      contextMenu.style.display = "block";
    });
    window.addEventListener("click", () => contextMenu.style.display = "none");

    document.getElementById("ctx-upload").onclick = () => {
      const input = document.createElement("input");
      input.type = "file";
      input.onchange = e => uploadFile(e.target.files[0]);
      input.click();
    };

    document.getElementById("ctx-newfolder").onclick = async () => {
      const folderName = prompt("Nama folder baru:");
      if (!folderName) return;
      await fetch("/api/upload", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: currentPath, folderName }),
      });
      loadFiles(currentPath);
    };

    loadFiles();
  </script>
</body>
</html>
