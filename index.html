<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Mini Drive LPDP UGM</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f7f9fb; }
    header { padding: 1em; background: #465fff; color: white; font-weight: bold; }
    #path { margin-left: 10px; font-size: 0.9em; opacity: 0.8; }
    #grid { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
    .item {
      background: white; border-radius: 10px; padding: 12px; width: 150px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .item:hover { background: #eef1ff; }
    .item img { width: 64px; height: 64px; object-fit: contain; }
    #dropzone {
      position: fixed; inset: 0; border: 3px dashed #465fff;
      background: rgba(70,95,255,0.05); display: none;
      align-items: center; justify-content: center; color: #465fff;
      font-size: 1.2em; font-weight: bold;
    }
    #menu {
      position: fixed; background: white; border: 1px solid #ddd; border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: none;
      flex-direction: column; z-index: 99;
    }
    #menu button { background: none; border: none; padding: 8px 16px; text-align: left; cursor: pointer; }
    #menu button:hover { background: #465fff; color: white; }
  </style>
</head>
<body>
  <header>📁 Mini Drive <span id="path">/</span></header>
  <div id="grid"></div>
  <div id="dropzone">Lepas file di sini untuk upload</div>
  <div id="menu"></div>

  <script>
    const repoOwner = "lpdpugm";
    const repoName = "penyimpanan";
    const branch = "main";
    const baseApi = `https://api.github.com/repos/${repoOwner}/${repoName}/contents`;
    const baseUrl = "https://simpan-lpdpugm.vercel.app";

    let currentPath = "";

    async function listFolder(path = "") {
      const res = await fetch(`${baseApi}/${path}?ref=${branch}`);
      const data = await res.json();
      const grid = document.getElementById("grid");
      const pathLabel = document.getElementById("path");

      pathLabel.textContent = "/" + (path || "");
      grid.innerHTML = "";

      if (path) {
        const back = document.createElement("div");
        back.className = "item";
        back.textContent = "⬅️ ..";
        back.onclick = () => listFolder(path.split("/").slice(0, -1).join("/"));
        grid.appendChild(back);
      }

      if (!Array.isArray(data)) return;

      data
        .filter(f => f.name !== "api")
        .sort((a, b) => a.type.localeCompare(b.type))
        .forEach(item => {
          const div = document.createElement("div");
          div.className = "item";
          div.dataset.name = item.name;
          div.dataset.path = item.path;
          div.dataset.type = item.type;

          if (item.type === "dir") {
            div.innerHTML = `<img src="https://cdn-icons-png.flaticon.com/512/716/716784.png"><div>${item.name}</div>`;
            div.onclick = () => listFolder(item.path);
          } else {
            const ext = item.name.split(".").pop().toLowerCase();
            if (!path && ["md", "html"].includes(ext)) return;
            div.innerHTML = `<img src="https://cdn-icons-png.flaticon.com/512/337/337946.png"><div>${item.name}</div>`;
            div.onclick = () => window.open(item.download_url);
          }

          grid.appendChild(div);
        });
    }

    // Drag-drop upload
    const dz = document.getElementById("dropzone");
    document.body.addEventListener("dragover", e => {
      e.preventDefault(); dz.style.display = "flex";
    });
    document.body.addEventListener("dragleave", e => {
      e.preventDefault(); dz.style.display = "none";
    });
    document.body.addEventListener("drop", async e => {
      e.preventDefault(); dz.style.display = "none";
      const files = e.dataTransfer.files;
      for (const f of files) {
        const b64 = await toBase64(f);
        const path = `${currentPath ? currentPath + "/" : ""}${f.name}`;
        await uploadFile(path, b64);
      }
      listFolder(currentPath);
    });

    async function uploadFile(path, content) {
      const res = await fetch("/api/upload", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ path, content: content.split(",")[1] })
      });
      return res.json();
    }

    // Klik kanan menu
    const menu = document.getElementById("menu");
    document.addEventListener("contextmenu", e => {
      e.preventDefault();
      const target = e.target.closest(".item");
      menu.innerHTML = "";
      menu.style.display = "flex";
      menu.style.left = e.pageX + "px";
      menu.style.top = e.pageY + "px";

      if (target && target.dataset.type === "file") {
        const fileUrl = `${baseUrl}/${encodeURIComponent(target.dataset.path).replace(/%2F/g, "/")}`;
        addMenu("Salin Link", () => {
          navigator.clipboard.writeText(fileUrl);
          alert("Link disalin!");
        });
        addMenu("Hapus File", () => alert("Hapus file nanti bisa ditambah ke API."));
      } else {
        addMenu("Buat Folder Baru", async () => {
          const name = prompt("Nama folder baru:");
          if (!name) return;
          const dummy = btoa(""); // kosong
          const folderPath = `${currentPath ? currentPath + "/" : ""}${name}/.keep`;
          await uploadFile(folderPath, dummy);
          listFolder(currentPath);
        });
      }
    });
    document.addEventListener("click", () => (menu.style.display = "none"));

    function addMenu(text, fn) {
      const btn = document.createElement("button");
      btn.textContent = text;
      btn.onclick = fn;
      menu.appendChild(btn);
    }

    function toBase64(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
    }

    listFolder();
  </script>
</body>
</html>
