<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Manager GitHub</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .hidden-input { display: none; }
    .success { color: green; }
    .error { color: red; }
    .url { font-family: monospace; word-break: break-all; }
    .file-list { max-height: 400px; overflow-y: auto; }
  </style>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">File Manager GitHub</h4>
      </div>
      <div class="card-body">
        <!-- Tab Navigation -->
        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="upload-tab" data-bs-toggle="tab" data-bs-target="#upload" type="button" role="tab">Upload</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="list-tab" data-bs-toggle="tab" data-bs-target="#list" type="button" role="tab" onclick="fetchFileList()">Daftar File</button>
          </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="myTabContent">
          <!-- Tab Upload -->
          <div class="tab-pane fade show active" id="upload" role="tabpanel">
            <p class="text-muted">
              File akan di-upload langsung ke repo GitHub kamu.
            </p>

            <!-- Form Upload -->
            <form id="uploadForm">
              <!-- Input tersembunyi -->
              <div class="hidden-input">
                <input type="text" id="token" value="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" required />
                <input type="text" id="owner" value="lpdpugm" required />
                <input type="text" id="repo" value="penyimpanan" required />
                <input type="text" id="branch" value="main" required />
              </div>

              <div class="mb-3">
                <label for="folderSelect" class="form-label">Folder Tujuan:</label>
                <select class="form-select" id="folderSelect">
                  <option value="uploads/" selected>uploads/</option>
                  <!-- Opsi folder akan diisi oleh JS -->
                </select>
                <input type="text" class="form-control mt-2" id="newFolderInput" placeholder="Nama folder baru..." style="display: none;">
                <button type="button" class="btn btn-sm btn-outline-secondary mt-2" id="toggleFolderInput">Buat Folder Baru</button>
              </div>

              <div class="mb-3">
                <label for="file" class="form-label">Pilih File:</label>
                <input type="file" class="form-control" id="file" required />
              </div>

              <button type="button" class="btn btn-success" onclick="uploadFile()">Upload ke GitHub</button>
            </form>

            <!-- Hasil Upload -->
            <div id="result" class="mt-4"></div>
          </div>

          <!-- Tab Daftar File -->
          <div class="tab-pane fade" id="list" role="tabpanel">
            <h5>Daftar File di Repo</h5>
            <div id="fileList" class="file-list">
              <p>Loading...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Konfigurasi default
    const CONFIG = {
      token: "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", 
      owner: "lpdpugm",         
      repo: "penyimpanan",              
      branch: "main"                 
    };

    // State untuk menyimpan folder yang diambil dari API
    let availableFolders = [];

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("token").value = CONFIG.token;
      document.getElementById("owner").value = CONFIG.owner;
      document.getElementById("repo").value = CONFIG.repo;
      document.getElementById("branch").value = CONFIG.branch;

      // Event listener untuk tombol toggle input folder
      document.getElementById('toggleFolderInput').addEventListener('click', function () {
          const select = document.getElementById('folderSelect');
          const input = document.getElementById('newFolderInput');
          if (input.style.display === 'none') {
              input.style.display = 'block';
              select.style.display = 'none';
              this.textContent = 'Pilih Folder Lama';
          } else {
              input.style.display = 'none';
              select.style.display = 'block';
              this.textContent = 'Buat Folder Baru';
          }
      });

      // Ambil folder saat halaman dimuat
      fetchFolders();
    });

    // Fungsi untuk mengambil folder dari GitHub
    async function fetchFolders() {
        try {
            const response = await fetch(
                `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents`,
                { headers: { Authorization: `Bearer ${CONFIG.token}` } }
            );
            const contents = await response.json();

            // Filter hanya folder
            availableFolders = contents
                .filter(item => item.type === 'dir')
                .map(item => item.name);

            updateFolderDropdown(availableFolders);
        } catch (err) {
            console.error('Gagal mengambil folder:', err);
            // Tidak menampilkan error di UI karena bisa jadi tidak penting untuk upload
        }
    }

    // Fungsi untuk memperbarui dropdown folder
    function updateFolderDropdown(folders) {
        const select = document.getElementById('folderSelect');
        // Kosongkan opsi kecuali default
        select.innerHTML = '<option value="uploads/" selected>uploads/</option>';
        folders.forEach(folder => {
            const option = document.createElement('option');
            option.value = folder + '/';
            option.textContent = folder + '/';
            select.appendChild(option);
        });
    }

    // Fungsi upload file
    async function uploadFile() {
      const token = document.getElementById('token').value.trim();
      const owner = document.getElementById('owner').value.trim();
      const repo = document.getElementById('repo').value.trim();
      const branch = document.getElementById('branch').value.trim() || 'main';

      // Tentukan folder berdasarkan UI
      let folder = '';
      const select = document.getElementById('folderSelect');
      const input = document.getElementById('newFolderInput');
      if (select.style.display !== 'none') {
          folder = select.value;
      } else if (input.style.display !== 'none' && input.value.trim() !== '') {
          folder = input.value.trim();
          if (!folder.endsWith('/')) folder += '/';
      }

      const fileInput = document.getElementById('file');
      const resultDiv = document.getElementById('result');

      if (!token || !owner || !repo || !fileInput.files[0]) {
        resultDiv.innerHTML = '<p class="error">Token, owner, repo, dan file harus diisi.</p>';
        return;
      }

      const file = fileInput.files[0];
      const fileName = file.name;
      const filePath = (folder ? folder.replace(/\/$/, '') + '/' : '') + fileName;

      resultDiv.innerHTML = '<p class="text-info">Uploading...</p>';

      try {
        const content = await readFileAsBase64(file);

        // GitHub API: Get current commit SHA untuk branch
        const branchInfo = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/branches/${branch}`,
          { headers: { Authorization: `Bearer ${token}` } }
        ).then(r => r.json());

        const sha = branchInfo.commit.sha;

        // Ambil tree dari commit terakhir
        const commit = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/git/commits/${sha}`,
          { headers: { Authorization: `Bearer ${token}` } }
        ).then(r => r.json());

        const treeSha = commit.tree.sha;

        // Buat tree baru dengan file
        const newTree = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/git/trees`,
          {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              base_tree: treeSha,
              tree: [
                {
                  path: filePath,
                  mode: '100644',
                  type: 'blob',
                  content: atob(content.split(',')[1]) // Decode base64
                }
              ]
            })
          }
        ).then(r => r.json());

        // Buat commit baru
        const commitRes = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/git/commits`,
          {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: `Upload file: ${fileName}`,
              tree: newTree.sha,
              parents: [sha]
            })
          }
        ).then(r => r.json());

        // Update reference branch ke commit baru
        await fetch(
          `https://api.github.com/repos/${owner}/${repo}/git/refs/heads/${branch}`,
          {
            method: 'PATCH',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              sha: commitRes.sha
            })
          }
        );

        // Refresh folder list setelah upload
        fetchFolders();

        const publicUrl = `https://${owner}.github.io/${repo}/${filePath}`;
        resultDiv.innerHTML = `
          <div class="alert alert-success">
            ✅ File berhasil diupload!<br>
            <strong>URL Publik:</strong> <span class="url">${publicUrl}</span><br>
            <button class="btn btn-sm btn-outline-success mt-2" onclick="navigator.clipboard.writeText('${publicUrl}')">Copy URL</button>
          </div>
        `;
      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = `<div class="alert alert-danger">❌ Error: ${err.message || 'Terjadi kesalahan.'}</div>`;
      }
    }

    // Fungsi untuk membaca file sebagai base64
    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = err => reject(err);
        reader.readAsDataURL(file);
      });
    }

    // Fungsi untuk mengambil dan menampilkan daftar file
    async function fetchFileList() {
        const fileListDiv = document.getElementById('fileList');
        fileListDiv.innerHTML = '<p>Loading...</p>';

        try {
            // Ambil konten root
            const response = await fetch(
                `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/uploads?ref=${CONFIG.branch}`,
                { headers: { Authorization: `Bearer ${CONFIG.token}` } }
            );
            const contents = await response.json();

            if (!Array.isArray(contents)) {
                fileListDiv.innerHTML = '<p class="error">Tidak dapat mengambil daftar file. Pastikan folder uploads/ ada.</p>';
                return;
            }

            if (contents.length === 0) {
                fileListDiv.innerHTML = '<p>Folder uploads kosong.</p>';
                return;
            }

            let html = '<ul class="list-group">';
            contents.forEach(item => {
                if (item.type === 'file') { // Hanya tampilkan file, bukan folder
                    const publicUrl = `https://${CONFIG.owner}.github.io/${CONFIG.repo}/${item.path}`;
                    html += `
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span>${item.name}</span>
                            <button class="btn btn-sm btn-outline-primary" onclick="navigator.clipboard.writeText('${publicUrl}')">Copy URL</button>
                        </li>
                    `;
                }
            });
            html += '</ul>';
            fileListDiv.innerHTML = html;

        } catch (err) {
            console.error(err);
            fileListDiv.innerHTML = `<p class="error">Gagal mengambil daftar file: ${err.message}</p>`;
        }
    }
  </script>
</body>
</html>
